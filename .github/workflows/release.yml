name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string
      draft:
        description: "Keep as draft release instead of publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-draft:
    name: "Create Draft Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: get-tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -e "console.log(require('./apps/web/src-tauri/tauri.conf.json').version)")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or resolve draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.get-tag.outputs.tag }}";
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            let release = releases.data.find(r => r.tag_name === tag);
            if (!release) {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `ClickUp Lite ${tag}`,
                body: `## ClickUp Lite ${tag}\n\nDesktop menubar companion for ClickUp.\n\n### Downloads\n- **macOS (Apple Silicon)**: \`.dmg\` (M1 / M2 / M3 / M4 - ARM64)\n- **Windows**: \`.exe\` (NSIS Installer)\n\n### SHA256 Checksums & Assets\nSee attached release artifacts below.`,
                draft: true,
                prerelease: false,
              });
              release = created.data;
            }
            return release.id;

  build-tauri:
    name: ${{ matrix.name }}
    needs: create-draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            name: "Build macOS (Apple Silicon - aarch64)"
            rust_targets: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: "windows-latest"
            name: "Build Windows (x64)"
            rust_targets: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/web/src-tauri"
          cache-all-crates: "true"

      - name: Prepare environment file
        shell: bash
        env:
          VITE_CLICKUP_CLIENT_ID: ${{ secrets.VITE_CLICKUP_CLIENT_ID }}
          VITE_CLICKUP_CLIENT_SECRET: ${{ secrets.VITE_CLICKUP_CLIENT_SECRET }}
          VITE_CLICKUP_REDIRECT_URI: ${{ secrets.VITE_CLICKUP_REDIRECT_URI || 'http://localhost:3456/callback' }}
        run: |
          if [ -n "${VITE_CLICKUP_CLIENT_ID}" ]; then
            echo "VITE_CLICKUP_CLIENT_ID=${VITE_CLICKUP_CLIENT_ID}" >> .env
            echo "VITE_CLICKUP_CLIENT_SECRET=${VITE_CLICKUP_CLIENT_SECRET}" >> .env
            echo "VITE_CLICKUP_REDIRECT_URI=${VITE_CLICKUP_REDIRECT_URI}" >> .env
            cp .env apps/web/.env
          fi

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Build and Upload with Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "apps/web"
          tauriScript: "bun tauri"
          releaseId: ${{ needs.create-draft.outputs.release_id }}
          tagName: ${{ needs.create-draft.outputs.tag_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  publish-release:
    name: "Publish Release"
    needs: [create-draft, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        if: ${{ inputs.draft != true }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-draft.outputs.release_id }},
              draft: false,
            });
